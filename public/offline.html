<!doctype html>
<html lang="en-NG">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#dd6042" />
    <meta name="robots" content="noindex" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; form-action 'self'; base-uri 'none'"
    />
    <title>You’re offline · justurban wears</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Manrope, "Avenir Next", Avenir, Helvetica, Arial, sans-serif;
        background: #fff8f4;
        color: #2b1d18;
      }

      * {
        box-sizing: border-box;
      }

      body {
        align-items: center;
        background:
          radial-gradient(circle at 85% 0%, rgb(245 196 181 / 65%), transparent 28rem),
          #fff8f4;
        display: grid;
        margin: 0;
        min-height: 100vh;
        padding: 24px;
      }

      main {
        background: rgb(255 253 251 / 86%);
        border: 0;
        border-radius: 28px;
        box-shadow: 0 28px 80px rgb(82 40 24 / 13%);
        margin: auto;
        max-width: 620px;
        padding: clamp(32px, 8vw, 64px);
        width: 100%;
      }

      p {
        color: #76625a;
        line-height: 1.65;
        margin: 16px 0 0;
      }

      .eyebrow {
        color: #a33e2b;
        font-size: 0.75rem;
        font-weight: 800;
        letter-spacing: 0.14em;
        margin: 0 0 18px;
        text-transform: uppercase;
      }

      h1 {
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(2.5rem, 10vw, 4.75rem);
        font-weight: 500;
        letter-spacing: -0.055em;
        line-height: 0.98;
        margin: 0;
      }

      a {
        background: #963824;
        border-radius: 999px;
        color: #fff9f5;
        display: inline-flex;
        font-weight: 750;
        margin-top: 30px;
        min-height: 48px;
        padding: 14px 22px;
        text-decoration: none;
      }

      a:focus-visible {
        outline: 3px solid #2b1d18;
        outline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">justurban wears</p>
      <h1>You’re between connections.</h1>
      <p>
        The live edit needs a connection so availability stays honest. Reconnect, then return to the shop to continue.
      </p>
      <a href="/shop">Try the shop again</a>
    </main>
  </body>
</html>
