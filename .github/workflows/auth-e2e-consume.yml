name: Verify isolated email-code authentication

on:
  push:
    branches: [agent/phase-0-release-foundation]
    paths:
      - auth-e2e/request.json

permissions:
  contents: read
  actions: read

concurrency:
  group: juw-auth-e2e
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
      - name: Recover the one-time code without exposing it
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .auth-e2e/artifact
          artifact_id="$(node -p "JSON.parse(require('node:fs').readFileSync('auth-e2e/request.json', 'utf8')).privateArtifactId")"
          curl --fail --silent --show-error --location \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
            -o .auth-e2e/private.zip
          unzip -q .auth-e2e/private.zip -d .auth-e2e/artifact
          private_key="$(find .auth-e2e/artifact -type f -name private.pem -print -quit)"
          test -n "${private_key}"
          node <<'NODE'
          const fs = require("node:fs");
          const request = JSON.parse(fs.readFileSync("auth-e2e/request.json", "utf8"));
          fs.writeFileSync(".auth-e2e/otp.enc", Buffer.from(request.ciphertext, "base64"), { mode: 0o600 });
          NODE
          openssl pkeyutl -decrypt \
            -inkey "${private_key}" \
            -in .auth-e2e/otp.enc \
            -out .auth-e2e/otp.txt \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256
          otp="$(tr -d '\r\n' < .auth-e2e/otp.txt)"
          test "${#otp}" -eq 6
          echo "::add-mask::${otp}"
          printf '%s' "${otp}" > .auth-e2e/otp.txt
          unset otp
      - name: Verify production session and authorization boundaries
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          import fs from "node:fs";

          const origin = "https://www.justurbanwears.com";
          const request = JSON.parse(fs.readFileSync("auth-e2e/request.json", "utf8"));
          const otp = fs.readFileSync(".auth-e2e/otp.txt", "utf8").trim();

          const requestHeaders = {
            accept: "application/json",
            "content-type": "application/json",
            origin,
            referer: `${origin}/auth/sign-in?returnTo=%2Fstudio`,
            "user-agent": "justurbanwears-auth-e2e/1.0",
          };

          const signIn = await fetch(`${origin}/api/auth/sign-in/email-otp`, {
            method: "POST",
            headers: requestHeaders,
            body: JSON.stringify({ email: request.email, otp }),
            redirect: "manual",
          });
          if (!signIn.ok) {
            throw new Error(`Email-code sign-in failed with HTTP ${signIn.status}.`);
          }

          const setCookies = typeof signIn.headers.getSetCookie === "function"
            ? signIn.headers.getSetCookie()
            : [];
          const cookie = setCookies
            .map((value) => value.split(";", 1)[0])
            .filter(Boolean)
            .join("; ");
          if (!cookie) {
            throw new Error("Email-code sign-in returned no session cookie.");
          }
          console.log(`Email-code sign-in accepted with HTTP ${signIn.status}.`);

          const authenticatedGet = (pathname) => fetch(`${origin}${pathname}`, {
            headers: {
              accept: "application/json",
              cookie,
              referer: `${origin}/studio`,
              "user-agent": "justurbanwears-auth-e2e/1.0",
            },
            redirect: "manual",
          });

          const sessionResponse = await authenticatedGet("/api/auth/get-session");
          if (!sessionResponse.ok) {
            throw new Error(`Session lookup failed with HTTP ${sessionResponse.status}.`);
          }
          const session = await sessionResponse.json();
          const hasIdentity = Boolean(
            session?.session ||
            session?.user ||
            session?.data?.session ||
            session?.data?.user
          );
          if (!hasIdentity) {
            throw new Error("Session lookup returned no authenticated identity.");
          }
          console.log("Authenticated session resolved.");

          const ordersResponse = await authenticatedGet("/api/shop/orders");
          if (ordersResponse.status !== 200) {
            throw new Error(`Customer order boundary returned HTTP ${ordersResponse.status}.`);
          }
          console.log("Authenticated customer order boundary passed.");

          const studioResponse = await authenticatedGet("/api/studio/wardrobe");
          if (studioResponse.status !== 200) {
            throw new Error(`Studio operator boundary returned HTTP ${studioResponse.status}.`);
          }
          console.log("Studio operator allowlist and membership boundary passed.");
          NODE
      - name: Destroy authentication material
        if: always()
        shell: bash
        run: rm -rf .auth-e2e
