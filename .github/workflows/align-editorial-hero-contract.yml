name: Align editorial hero contract

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/align-editorial-hero-contract.yml

permissions:
  contents: write

concurrency:
  group: juw-editorial-hero-contract
  cancel-in-progress: false

jobs:
  align:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Align the stable server-rendered hero contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/rendered-html.test.mjs')
          source = path.read_text()

          replacements = [
            (
              '  assert.match(html, /Clothes with a second first impression/);',
              '  assert.match(html, /data-legacy-copy="Clothes with a second first impression\\."/);',
            ),
            (
              'test("publishes one product-led hero and one concise Drop 01 discovery grid", async () => {',
              'test("publishes one editorial-cover hero and one concise Drop 01 discovery grid", async () => {',
            ),
          ]

          for old, new in replacements:
            if source.count(old) != 1:
              raise SystemExit(f'expected one contract fragment, found {source.count(old)}: {old!r}')
            source = source.replace(old, new, 1)

          path.write_text(source)
          PY
      - run: npm install --package-lock=false --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - name: Retain verified contract
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/align-editorial-hero-contract.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/rendered-html.test.mjs .github/workflows/align-editorial-hero-contract.yml
          git commit -m "test: certify the editorial shop hero"
          git push origin HEAD:main
