name: Align editorial hero contract

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/align-editorial-hero-contract.yml

permissions:
  contents: write

concurrency:
  group: juw-editorial-hero-contract
  cancel-in-progress: false

jobs:
  align:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Align rendered HTML expectations
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/rendered-html.test.mjs')
          source = path.read_text()

          old = '  assert.match(html, /Clothes with a second first impression/);\n'
          new = '''  assert.match(html, /shop-hero-editorial/);
          assert.match(html, /Define/);
          assert.match(html, /urban\\./);
          assert.match(html, /Shop the edit/);
          '''
          if source.count(old) != 1:
              raise SystemExit(f'expected one legacy hero assertion, found {source.count(old)}')
          source = source.replace(old, new)

          old_title = 'test("publishes one product-led hero and one concise Drop 01 discovery grid", async () => {'
          new_title = 'test("publishes one editorial-cover hero and one concise Drop 01 discovery grid", async () => {'
          if source.count(old_title) != 1:
              raise SystemExit(f'expected one legacy test title, found {source.count(old_title)}')
          source = source.replace(old_title, new_title)

          start = source.index(new_title)
          end = source.index('  const releasedProducts = [', start)
          block = source[start:end]

          visible_line = '  const visibleBody = visibleMarkup(html);\n'
          authored_assertions = '''  const visibleBody = visibleMarkup(html);
          assert.match(visibleBody, /class="shop-editorial-cover"/);
          assert.match(visibleBody, /class="shop-editorial-cover-wordmark">JUW</);
          assert.doesNotMatch(visibleBody, /shop-hero-copy|shop-hero-stage/);
          '''
          if block.count(visible_line) != 1:
              raise SystemExit(f'expected one visible body line in hero test, found {block.count(visible_line)}')
          block = block.replace(visible_line, authored_assertions)

          old_anchor = '  assert.match(visibleBody, /data-model-anchor="lulu-v2"/);\n'
          new_anchor = '  assert.match(visibleBody, /data-model-anchor="lulu-v3"/);\n'
          if block.count(old_anchor) != 1:
              raise SystemExit(f'expected one legacy hero anchor, found {block.count(old_anchor)}')
          block = block.replace(old_anchor, new_anchor)

          source = source[:start] + block + source[end:]
          path.write_text(source)
          PY
      - run: npm install --package-lock=false --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - name: Retain verified contract
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/align-editorial-hero-contract.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/rendered-html.test.mjs .github/workflows/align-editorial-hero-contract.yml
          git commit -m "test: certify the editorial shop hero"
          git push origin HEAD:main
