name: Quality gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
      - name: Install the locked dependency graph
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate repository, contracts, and production build
        shell: bash
        run: |
          set -o pipefail
          npm run verify 2>&1 | tee verify.log
      - name: Preserve verification diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verify-log-${{ github.run_id }}
          path: verify.log
          if-no-files-found: error
          retention-days: 7
