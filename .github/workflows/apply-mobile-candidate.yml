name: Apply mobile completion candidate

on:
  push:
    branches:
      - agent/mobile-source-export
    paths:
      - .github/workflows/apply-mobile-candidate.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mobile-source-export
          fetch-depth: 0
      - name: Apply the exact reviewed mobile patch
        env:
          PATCH_GZ_B64: 
        run: |
          python - <<'PY'
          import os, base64, gzip
          from pathlib import Path
          Path('/tmp/mobile.patch').write_bytes(gzip.decompress(base64.b64decode(os.environ['PATCH_GZ_B64'])))
          PY
          git apply --check /tmp/mobile.patch
          git apply /tmp/mobile.patch
      - name: Validate source syntax
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const ts = require('/opt/hostedtoolcache/node/22.19.0/x64/lib/node_modules/typescript/lib/typescript.js');
          const files = [
            'components/studio/app-shell.tsx',
            'components/shop/product-media-gallery.tsx',
            'components/shop/product-detail.tsx',
            'app/(studio)/layout.tsx',
            'tests/studio-mobile-ux-contract.test.ts',
            'tests/mobile-commerce-focus.test.ts',
          ];
          for (const file of files) {
            const result = ts.transpileModule(fs.readFileSync(file, 'utf8'), {
              fileName: file,
              compilerOptions: { jsx: ts.JsxEmit.ReactJSX, module: ts.ModuleKind.ESNext, target: ts.ScriptTarget.ES2022 },
              reportDiagnostics: true,
            });
            const errors = (result.diagnostics || []).filter((item) => item.category === ts.DiagnosticCategory.Error);
            if (errors.length) throw new Error(`${file}: ${errors.map((item) => ts.flattenDiagnosticMessageText(item.messageText, '\n')).join('\n')}`);
          }
          NODE
      - name: Commit candidate
        run: |
          git config user.name "Dr Dyrane Alexander"
          git config user.email "Ogranya.Alex@gmail.com"
          git add \
            app/mobile-experience.css \
            app/studio-mobile-final.css \
            'app/(studio)/layout.tsx' \
            components/shop/product-detail.tsx \
            components/shop/product-media-gallery.tsx \
            components/studio/app-shell.tsx \
            tests/mobile-commerce-focus.test.ts \
            tests/studio-mobile-ux-contract.test.ts
          git commit -m "Finish the mobile Shop and Studio"
          git push origin HEAD:agent/mobile-source-export
