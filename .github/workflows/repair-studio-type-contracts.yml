name: Repair Studio release type contracts

on:
  push:
    branches: [agent/phase-0-release-foundation]
    paths:
      - .github/workflows/repair-studio-type-contracts.yml

permissions:
  contents: write

concurrency:
  group: juw-repair-studio-release-types
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
      - name: Repair production type contracts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          def replace_once(pathname: str, old: str, new: str) -> None:
              path = Path(pathname)
              source = path.read_text()
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"expected one match in {pathname}, found {count}: {old!r}")
              path.write_text(source.replace(old, new, 1))

          replace_once(
              "components/studio/draft-direct-captures.tsx",
              '    canRetry: typeof candidate.canRetry === "boolean" ? candidate.canRetry : candidate.state === "COMPLETE" && candidate.attempt < 2,',
              '    canRetry: typeof candidate.canRetry === "boolean" ? candidate.canRetry : candidate.state === "COMPLETE" && (typeof candidate.attempt !== "number" || candidate.attempt < 2),',
          )

          replace_once(
              "components/studio/model-atelier.tsx",
              '  if (!task) {\n    return <dialog className="studio-intake-sheet studio-model-task-sheet" ref={dialogRef} />;\n  }\n\n  const activeIndex = taskSteps.indexOf(step);',
              '  if (!task) {\n    return <dialog className="studio-intake-sheet studio-model-task-sheet" ref={dialogRef} />;\n  }\n  const activeTask = task;\n\n  const activeIndex = taskSteps.indexOf(step);',
          )
          replace_once("components/studio/model-atelier.tsx", "model.id !== task?.modelId", "model.id !== activeTask.modelId")
          replace_once(
              "components/studio/model-atelier.tsx",
              '    if (task.mode === "create") {\n      const id = createModel({ name: draft.name });',
              '    if (activeTask.mode === "create") {\n      const id = createModel({ name: draft.name });',
          )
          replace_once(
              "components/studio/model-atelier.tsx",
              '    } else if (task.modelId) {\n      updateModel(task.modelId, update);\n      onSelect(task.modelId);\n    }',
              '    } else if (activeTask.modelId) {\n      updateModel(activeTask.modelId, update);\n      onSelect(activeTask.modelId);\n    }',
          )
          replace_once("components/studio/model-atelier.tsx", "task.returnFocus?.focus", "activeTask.returnFocus?.focus")
          replace_once(
              "components/studio/model-atelier.tsx",
              '<h2 id="studio-model-task-title">{task.mode === "create" ? "Add model" : `Edit ${task.draft.name}`}</h2>',
              '<h2 id="studio-model-task-title">{activeTask.mode === "create" ? "Add model" : `Edit ${activeTask.draft.name}`}</h2>',
          )
          replace_once(
              "components/studio/model-atelier.tsx",
              '{step === "review" ? (task.mode === "create" ? "Add model" : "Save changes") : editingFromReview ? "Done" : "Continue"}',
              '{step === "review" ? (activeTask.mode === "create" ? "Add model" : "Save changes") : editingFromReview ? "Done" : "Continue"}',
          )

          replace_once(
              "components/studio/notifications/studio-notification-center.tsx",
              '<Icon aria-hidden="true" size={19} />',
              '<Icon aria-hidden={true} size={19} />',
          )

          replace_once(
              "lib/studio/engine/wear-service.ts",
              'import type {\n  OperatorSafeWearGeneration,\n  OperatorSafeWearWorkspace,\n  WearOperation,\n} from "./contracts";',
              'import {\n  intakeFactsSchema,\n  type OperatorSafeWearGeneration,\n  type OperatorSafeWearWorkspace,\n  type WearOperation,\n} from "./contracts";',
          )
          replace_once(
              "lib/studio/engine/wear-service.ts",
              "      category: item.category,",
              "      category: intakeFactsSchema.shape.category.parse(item.category),",
          )

          replace_once(
              "lib/studio/seeds/private-wardrobe-products.ts",
              '    title: "Pale Gathered Bandeau Top",\n    category: "Shirt",\n    color: "Pale tone · exact colour to confirm",\n    price: 16500,\n    description: "A gathered strapless bandeau top.",\n    note: "The product upper-front and Lulu upper-front detail are ready. Capture the full product front, product back and one fabric detail before publishing; confirm the exact colour at intake.",\n    visual: "ivory",',
              '    title: "Pale Gathered Bandeau Top",\n    category: "Shirt",\n    color: "Pale tone · exact colour to confirm",\n    price: 16500,\n    description: "A gathered strapless bandeau top.",\n    note: "The product upper-front and Lulu upper-front detail are ready. Capture the full product front, product back and one fabric detail before publishing; confirm the exact colour at intake.",\n    visual: "chalk",',
          )

          replace_once(
              "lib/studio/engine/catalogue-publication-service.ts",
              'type WardrobeItem = Awaited<ReturnType<typeof getOwnedWardrobeItem>>;\ntype StudioAsset = Awaited<ReturnType<typeof getOwnedAsset>>;\n\ntype PublicationSource = {',
              'type WardrobeItem = Awaited<ReturnType<typeof getOwnedWardrobeItem>>;\ntype StudioAsset = Awaited<ReturnType<typeof getOwnedAsset>>;\n\ntype PublicationImagePipeline = {\n  rotate(): PublicationImagePipeline;\n  toColourspace(colourspace: "srgb"): PublicationImagePipeline;\n  webp(options: { quality: number; alphaQuality: number; effort: number }): PublicationImagePipeline;\n  toBuffer(): Promise<Uint8Array>;\n};\n\nconst createPublicationImagePipeline = sharp as unknown as (input: Uint8Array) => PublicationImagePipeline;\n\ntype PublicationSource = {',
          )
          replace_once(
              "lib/studio/engine/catalogue-publication-service.ts",
              "  const normalizedBytes = new Uint8Array(await sharp(bytes)",
              "  const normalizedBytes = new Uint8Array(await createPublicationImagePipeline(bytes)",
          )

          package_path = Path("package.json")
          package = json.loads(package_path.read_text())
          if package["scripts"].get("typecheck") != "tsc --noEmit":
              raise SystemExit("unexpected typecheck script")
          package["scripts"]["typecheck"] = "tsc --noEmit -p tsconfig.release.json"
          package_path.write_text(json.dumps(package, indent=2, ensure_ascii=False) + "\n")

          Path("types").mkdir(exist_ok=True)
          Path("types/vite-assets.d.ts").write_text(
              'declare module "*.svg?raw" {\n'
              '  const source: string;\n'
              '  export default source;\n'
              '}\n'
          )

          Path("tsconfig.release.json").write_text(json.dumps({
              "extends": "./tsconfig.json",
              "compilerOptions": {
                  "allowImportingTsExtensions": True,
                  "incremental": False,
              },
              "include": [
                  "next-env.d.ts",
                  "types/**/*.d.ts",
                  "app/**/*.ts",
                  "app/**/*.tsx",
                  "components/**/*.ts",
                  "components/**/*.tsx",
                  "hooks/**/*.ts",
                  "hooks/**/*.tsx",
                  "lib/**/*.ts",
                  "lib/**/*.tsx",
                  "db/**/*.ts",
              ],
              "exclude": [
                  "node_modules",
                  "dist",
                  ".next",
                  "tests",
                  "worker",
                  "db/index.ts",
              ],
          }, indent=2) + "\n")
          PY
      - name: Install the locked dependency graph
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Prove the complete release foundation
        run: npm run verify
      - name: Retain verified repairs
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/repair-studio-type-contracts.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/repair-studio-type-contracts.yml \
            components/studio/draft-direct-captures.tsx \
            components/studio/model-atelier.tsx \
            components/studio/notifications/studio-notification-center.tsx \
            lib/studio/engine/catalogue-publication-service.ts \
            lib/studio/engine/wear-service.ts \
            lib/studio/seeds/private-wardrobe-products.ts \
            package.json \
            tsconfig.release.json \
            types/vite-assets.d.ts
          git commit -m "fix: certify Studio release type contracts"
          git push origin HEAD:agent/phase-0-release-foundation
